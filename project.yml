# XcodeGen spec for the herdr iOS app.
#
# The buildbox runs `xcodegen generate` before `xcodebuild`, so the Xcode project
# is DERIVED FROM THIS FILE and never committed. That is deliberate: an
# .xcodeproj is an opaque blob that cannot be reviewed, diffed, or authored from
# a machine without Xcode — and this app is written on Linux.
#
# Toolchain facts taken from the buildbox's own log (518340e.log), not assumed:
#   simulator   iPhone 17 Pro
#   SDK         iPhoneSimulator26.2
#   target      arm64-apple-ios17.0-simulator
#   bundle ids  com.jerryfane.<name>
name: Herdr

options:
  bundleIdPrefix: com.jerryfane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Debug + Release are the defaults (buildbox builds Debug-iphonesimulator; the Mac
# lane scripts/testflight.sh archives Release with AUTOMATIC account signing).
# Distribution is a release-type config used ONLY by the GitHub Actions CI archive,
# which needs MANUAL signing — isolated here so the CI's manual profile does not
# regress the Mac lane's automatic Release signing.
configs:
  Debug: debug
  Release: release
  Distribution: release

packages:
  # The local package, consumed unchanged. HerdrKit contains no UIKit or SwiftUI
  # so it keeps building and testing on Linux; the app depends on it, never the
  # reverse. If this link ever inverts, the Linux test suite silently stops
  # covering the layer the app runs on.
  HerdrKit:
    path: .
  # The VT emulator that renders the live terminal (#40). Added to the APP target
  # ONLY — never to Package.swift/HerdrKit, which must stay UIKit-free and
  # Linux-buildable (SwiftTerm is UIKit/AppKit). We use SwiftTerm's default
  # CoreText renderer, NOT its Metal backend. Pinned to v1.11.2 — the NEWEST tag
  # that predates the bundled `Shaders.metal` (added in v1.12.0): Xcode 26 makes
  # the Metal shader-compiler toolchain a separate download the local buildbox
  # lacks, so a metal-bearing SwiftTerm fails `CompileMetalFile` there. (SwiftTerm
  # itself only drops the shader when GITHUB_ACTIONS=true, which reaches the SPM
  # manifest on GH runners but not the local Mac — hence a metal-free pin builds on
  # BOTH.) iOS floor is under the app's. xcodegen's key is `exactVersion` (SwiftPM's
  # `exact:` is Package.swift syntax and xcodegen rejects it).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: "1.11.2"

targets:
  Herdr:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # Declared in step ONE rather than when a screen first needs it. Linking
      # HerdrKit into an iOS app exercises the libssh2 system library, the module
      # map and the platform floors — the exact surface that broke three ways in
      # #18 and was invisible from Linux every time. Better to find that now,
      # against ten lines of UI, than later against a thousand.
      - package: HerdrKit
        product: HerdrKit
      # SwiftTerm rides on the APP target only (it is UIKit/AppKit) — it renders
      # the live terminal in TerminalPaneView. HerdrKit deliberately does NOT
      # depend on it so the Linux build/test of the protocol layer stays intact.
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        # Marketed name is Herdrup (App Store / TestFlight); the home-screen label
        # matches it. The in-app title (ConnectView) reads "herdrup" in the design's
        # lowercase treatment.
        CFBundleDisplayName: Herdrup
        # Names the asset-catalog icon set for the runtime. actool also injects
        # this via ASSETCATALOG_COMPILER_APPICON_NAME, but this Info.plist is
        # generated (GENERATE_INFOPLIST_FILE: NO), so we set it explicitly too.
        CFBundleIconName: AppIcon
        # Export compliance: herdr uses ONLY standard, published encryption (AES/SSH
        # via a standard library — no proprietary or custom cryptography), which
        # QUALIFIES FOR THE STANDARD MASS-MARKET EXEMPTION (EAR Category 5 Part 2). So
        # this is `false` — the "uses standard encryption that qualifies for an
        # exemption" declaration used by essentially every SSH client on the App
        # Store. Owner (the legal authority) approved this determination 2026-08-05,
        # after the stricter `true` value was found to REQUIRE A FULL CCATS FILING to
        # upload (App Store Connect altool error 90592: an empty ITSEncryptionExport
        # ComplianceCode) — disproportionate for a standard-encryption test build.
        # A public App Store release should confirm the self-classification paperwork
        # with a compliance specialist; for TestFlight this uploads cleanly.
        ITSAppUsesNonExemptEncryption: false
        # Bundled design fonts (App/Fonts/, added as resources by xcodegen). Geist is
        # the APP voice, IBM Plex Mono the MACHINE voice — the two families the Claude
        # Design spec (herdr mobile.dc.html) is set in. Registered here so the runtime
        # loads them; DesignSystem.Typography addresses them by PostScript name. Both
        # are SIL OFL (licenses alongside the .ttf files).
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerryfane.herdr
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # The lamb app icon ("Herdrup — The Lamb", the approved icon kit). The
        # asset catalog lives under App/ (already a source path), so xcodegen
        # bundles it; this names the icon set inside it. Single 1024 artwork —
        # the mark survives to 48px, so iOS downscales it for every slot.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Distribution signing for the TestFlight/App Store archive lane. Team
        # FXQ5Z9HHY6 (Jerry Fanelli), automatic signing — the Mac archive runs with
        # `-allowProvisioningUpdates` using the Mac's signed-in Xcode account, which
        # creates/renews the Apple Distribution cert + App Store profile on demand.
        # These are INERT for the buildbox's iphonesimulator build (the simulator
        # is never code-signed), so the existing green sim build is unaffected;
        # they take effect only for a device archive. See scripts/testflight.sh.
        DEVELOPMENT_TEAM: FXQ5Z9HHY6
        CODE_SIGN_STYLE: Automatic
      # The Distribution config (GitHub Actions CI archive) signs MANUALLY, scoped to
      # THIS app target. It must NOT be passed on the xcodebuild command line: that
      # applies the provisioning profile to EVERY target, including the SwiftPM
      # dependency targets (swift-crypto / swift-nio, pulled via Citadel), which are
      # libraries that "do not support provisioning profiles" — and the archive fails.
      # Scoped here, only the app target carries the profile. It lives on Distribution,
      # NOT Release, so the Mac lane's automatic Release signing (scripts/testflight.sh)
      # is unaffected; Debug (the buildbox sim build) is never code-signed. The
      # specifier matches the profile minted into the `testflight` GitHub environment.
      configs:
        Distribution:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "Herdrup App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
