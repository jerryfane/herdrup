# Simulator compile-check, shared-terminal interaction receipts, and core tests.
# PR/manual only: no signing secrets or release uploads.
name: CI

on:
  # PULL REQUESTS, NOT EVERY PUSH.
  #
  # This job is a full Xcode build plus an XCUITest — ~17 minutes on a macOS runner,
  # which GitHub bills at roughly ten times the Linux rate. On `push` it fired for every
  # commit on every non-main branch, including work-in-progress pushes to branches that
  # never became a PR: 120 runs across 85 distinct branches, 35 of them repeat builds of a
  # branch that had already been built. That was ~71% of the account's entire monthly
  # GitHub bill, and it hit the spending limit, which took CI down for every private repo.
  #
  # The `concurrency` block below already cancels a superseded run, and it works — but it
  # can only help while the previous build is still running. Pushes minutes apart on a
  # 17-minute build never overlap, so each one cost a full build. Building per PR instead
  # of per push is what removes those.
  #
  # `main` is not branch-protected, so no required status check depends on the old push
  # trigger. `workflow_dispatch` stays for deliberate one-off runs.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  # A FOCUSED DISPATCH MODE, so one suite can be iterated without paying for the full
  # matrix: `only_suite` runs just that class on the iPhone destination and skips the
  # iPad rounds and the package regressions. A PR run is unaffected — the automatic
  # trigger carries no inputs, so the full matrix remains the gate.
  workflow_dispatch:
    inputs:
      only_suite:
        description: "Run only this HerdrUITests class (e.g. TerminalControlTests). Empty runs the full matrix."
        required: false
        default: ""
      only_device:
        description: "Destination for a focused run: iphone or ipad."
        required: false
        default: "iphone"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE 369 HerdrKit TESTS, WHICH UNTIL NOW RAN NOWHERE (herdrup#189).
  #
  # ci.yml built the app and ran the XCUITest and never invoked `swift test`, so every
  # test under Tests/HerdrKitTests was written, maintained and executed by nothing —
  # including the wire-protocol tests, which are the ones where silence is expensive: a
  # wrong CodingKey decodes as nil rather than throwing, so the app quietly loses a field
  # instead of failing. A failing test also sat unnoticed on main because of this.
  #
  # It needs no macOS runner. HerdrKit is pure Swift with no UI framework, so it builds
  # and tests on Linux in about 40 seconds — the cheapest job in the repo, on the runner
  # class that is free for public repositories.
  herdrkit:
    name: HerdrKit and SwiftTerm (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LoginShellCommandTests runs the app's SSH exec commands through every login
      # shell it finds, because sshd hands them to the ACCOUNT's shell and a fish
      # account broke every channel (herdrup#276). The container has only sh, bash
      # and dash; without these the test skips the shells that actually broke.
      - name: Install login shells
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fish zsh tcsh csh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Test vendored SwiftTerm core
        run: swift test --package-path Vendor/SwiftTerm


  # The shipped symbol font is a PRIVATE-USE-ONLY SUBSET of the upstream Nerd Fonts
  # artifact, because no cascade ordering can be right while the font also maps 14
  # non-private-use codepoints — see Tools/subset-symbols-font.py for the two bugs that
  # proved it. A committed binary nobody can re-derive is indistinguishable from a
  # hand-edited one, so this re-runs the subset over the retained upstream input and
  # fails if the bytes differ.
  #
  # ITS OWN JOB, on the plain runner, NOT a step in the Swift job: the `swift:6.1`
  # container carries no python3, so as a step there it exited 127 and turned the Linux
  # job red on this PR. Nothing here needs Swift, and nothing in Swift needs this.
  symbol-font-subset:
    name: Symbol font is the upstream subset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the symbol font is the upstream subset
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fontenv
          # PINNED: this compares sha256 byte-exactly, so an unpinned fontTools would
          # turn a future upstream release into a red X on unrelated PRs.
          /tmp/fontenv/bin/pip install --quiet 'fonttools==4.65.0'
          /tmp/fontenv/bin/python Tools/subset-symbols-font.py \
            Tools/upstream/SymbolsNerdFontMono-Regular.ttf --check

  # THE DEVICE SUITE, AS PARALLEL SIMULATOR JOBS. It used to be one serial job: the
  # iPhone suite (~45 min of tests), then the iPad rounds (~25 min) waiting behind it,
  # ~90 min per green run and 2-3 h whenever a failure triggered a whole-suite rerun.
  # Each shard builds for itself, which is cheaper than shipping DerivedData between
  # jobs. Booting the simulator during the build was measured to slow both on the
  # 3-CPU runner (build 11-14 min against 3 min), so the boot waits for the build.
  # Tools/ci/ui-shard.sh defines what each shard runs. The settings-stack shard builds
  # its own optimized Distribution app instead (herdrup#416). Four macOS jobs stay under
  # the account's limit of five concurrent macOS jobs, which other repos share.
  uitest:
    name: ui (${{ matrix.shard }})
    runs-on: macos-latest
    strategy:
      # Every shard reports its own evidence even when another shard fails.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.only_suite == '' && '["iphone-terminal","iphone-app","ipad","settings-stack"]' || '["focused"]') }}
    # Worst shard (iPhone app): font 10 + Gram 25 + status motion 10 + app 30 + SwiftTerm
    # build 10 + test 15, plus failed-only diagnostic reruns for font, Gram, status motion and
    # app (10 min each) and SwiftTerm (15) = 155 min; setup and the build come on top. A green
    # run of this shard takes ~50 min.
    timeout-minutes: 170
    env:
      SHARD: ${{ matrix.shard }}
      ONLY_SUITE: ${{ github.event.inputs.only_suite }}
      ONLY_DEVICE: ${{ github.event.inputs.only_device }}
    steps:
      - uses: actions/checkout@v4

      # SwiftTerm is vendored; cache any remaining resolved remote packages.
      # xcodebuild re-resolves against the generated project's package settings.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select Xcode and assert the iOS SDK
        run: |
          echo "Xcodes present:"; ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting: $LATEST"; sudo xcode-select -s "$LATEST"; xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphonesimulator[0-9.]+' | sed 's/iphonesimulator//' | sort -V | tail -1)
          echo "newest iOS simulator SDK: ${SDK:-<none>}"

      - name: Download the Metal toolchain
        # SwiftTerm >=1.12.0 bundles Apple/Metal/Shaders.metal unconditionally; Xcode 26
        # ships the Metal shader compiler as a separate component. Idempotent — a no-op
        # if already present. Without it `CompileMetalFile` fails.
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20 || \
            echo "::warning::-downloadComponent MetalToolchain returned nonzero (may already be present); continuing"

      - name: Install XcodeGen
        # Skip Homebrew's auto-update (it re-indexes every formula on a cold runner,
        # a minute-plus of pure overhead) — we only need the already-bottled xcodegen.
        # coreutils supplies `gtimeout`, which bounds each test invocation below;
        # macOS ships no `timeout` of its own.
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen coreutils

      - name: Generate project
        run: xcodegen generate

      - name: Select required iPhone and iPad simulators
        id: simulators
        run: |
          xcrun simctl list devices available --json > SimulatorDevices.json
          python3 - <<'PY'
          import json, os, re
          with open("SimulatorDevices.json") as source:
              devices = json.load(source)["devices"]
          runtimes = [
              (tuple(map(int, match.group(1).split("-"))), name)
              for name in devices
              if (match := re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+(?:-\d+)*)", name))
              and any(device.get("isAvailable", True) for device in devices[name])
          ]
          if not runtimes:
              raise SystemExit("::error::no available iOS simulator runtime")
          _, runtime = max(runtimes)
          available = [device for device in devices[runtime] if device.get("isAvailable", True)]
          phones = [device for device in available if device["name"].startswith("iPhone")]
          pads = [device for device in available if device["name"].startswith("iPad")]
          if not phones or not pads:
              raise SystemExit(f"::error::{runtime} requires both an iPhone and an iPad; no substitute or skip")
          ipad = next(
              (device for device in pads if "iPad Pro" in device["name"] and "13-inch" in device["name"]),
              pads[0],
          )
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, device in [("IPHONE_UDID", phones[0]), ("IPAD_UDID", ipad)]:
                  output.write(f"{key}={device['udid']}\n")
                  print(f"{runtime}: {key}={device['udid']} ({device['name']})")
          PY

      - name: Build app and tests for simulator (SwiftTerm 1.15.0 + Metal)
        if: matrix.shard != 'settings-stack'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Herdr.xcodeproj -scheme Herdr \
            -destination "platform=iOS Simulator,id=${IPHONE_UDID}" \
            -derivedDataPath .build-dd \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || xcodebuild build-for-testing \
            -project Herdr.xcodeproj -scheme Herdr \
            -destination "platform=iOS Simulator,id=${IPHONE_UDID}" \
            -derivedDataPath .build-dd \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the built bundle version
        if: matrix.shard != 'settings-stack'
        # READS THE BUILT PRODUCT, not the generated source plist. That distinction is
        # the whole point: xcodegen writes the literal "$(MARKETING_VERSION)" into
        # App/Info.plist and Xcode substitutes it during the build, so a source-plist
        # check reports an unsubstituted variable and proves nothing about what ships.
        # An earlier version of this step made exactly that mistake.
        #
        # The bug this exists for was invisible for months: nothing set
        # CFBundleShortVersionString, so xcodegen wrote its own default "1.0" while
        # project.yml said MARKETING_VERSION 0.1, and it surfaced only when Apple closed
        # the 1.0 train (altool 90186) and every upload started failing. Comparing the
        # BUILT value against project.yml proves the setting actually reaches the bundle.
        run: |
          # build-for-testing also produces a runner .app, whose version is unrelated.
          APP=.build-dd/Build/Products/Debug-iphonesimulator/Herdr.app
          if [ ! -d "$APP" ]; then echo "::error::main app missing at $APP"; exit 1; fi
          echo "built app: $APP"
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          EXPECTED=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*MARKETING_VERSION:[[:space:]]*//' | tr -d '" ')
          echo "built CFBundleShortVersionString=$BUILT  project.yml MARKETING_VERSION=$EXPECTED"
          if [ -z "$BUILT" ]; then echo "::error::built app has no CFBundleShortVersionString"; exit 1; fi
          case "$BUILT" in
            *'$('*) echo "::error::CFBundleShortVersionString did not substitute: $BUILT"; exit 1 ;;
          esac
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::built version ($BUILT) does not match project.yml MARKETING_VERSION ($EXPECTED) — the setting is not reaching the bundle"
            exit 1
          fi

      - name: Run the ${{ matrix.shard }} device shard
        run: Tools/ci/ui-shard.sh "$SHARD"

      - name: Export diagnostic composer events
        if: always()
        run: |
          mkdir -p TestReceipts
          xcrun simctl spawn "$IPHONE_UDID" log show --style compact --last 45m \
            --predicate 'eventMessage CONTAINS "[ComposerTrace]"' \
            > TestReceipts/composer-events.log 2>&1

      - name: Export simulator screenshots
        if: always()
        run: |
          for bundle in TestReceipts/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "${bundle%.xcresult}-attachments"
          done

      - name: Upload terminal receipts and first-failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-test-results-${{ matrix.shard }}
          path: |
            TestReceipts/
            SimulatorDevices.json
          if-no-files-found: ignore

  # The required status check on main. It keeps the name the branch protection rule
  # already requires, and passes only if every device shard passed.
  build-and-uitest:
    needs: uitest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every device shard to pass
        run: |
          if [ "${{ needs.uitest.result }}" != success ]; then
            echo "::error::device shards: ${{ needs.uitest.result }}"
            exit 1
          fi
          echo "all device shards passed"
