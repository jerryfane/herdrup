# Simulator compile-check + UI scroll-test for herdr-ios. Runs on feature-branch
# pushes and PRs — NO signing secrets, NO TestFlight upload (that stays in
# testflight.yml, gated to main + v* tags). This is the fast feedback loop for the
# SwiftTerm 1.15.0 upgrade: it proves the Metal-bearing SwiftTerm compiles (with the
# downloaded Metal toolchain) and that the app builds against the 1.15.0 API, then
# runs the XCUITest that drags a scrollback-seeded REAL SwiftTerm and asserts the
# content moves (the on-device gesture receipt JARVIS rule 47874 requires).
name: CI

on:
  # PULL REQUESTS, NOT EVERY PUSH.
  #
  # This job is a full Xcode build plus an XCUITest — ~17 minutes on a macOS runner,
  # which GitHub bills at roughly ten times the Linux rate. On `push` it fired for every
  # commit on every non-main branch, including work-in-progress pushes to branches that
  # never became a PR: 120 runs across 85 distinct branches, 35 of them repeat builds of a
  # branch that had already been built. That was ~71% of the account's entire monthly
  # GitHub bill, and it hit the spending limit, which took CI down for every private repo.
  #
  # The `concurrency` block below already cancels a superseded run, and it works — but it
  # can only help while the previous build is still running. Pushes minutes apart on a
  # 17-minute build never overlap, so each one cost a full build. Building per PR instead
  # of per push is what removes those.
  #
  # `main` is not branch-protected, so no required status check depends on the old push
  # trigger. `workflow_dispatch` stays for deliberate one-off runs.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-uitest:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Cache resolved Swift packages (SwiftTerm is a sizeable remote checkout that
      # bundles Metal shaders) so a build doesn't re-clone them every run. Keyed on
      # project.yml, which pins the package refs; restore-keys lets a near-miss still
      # seed the checkout, and xcodebuild re-resolves against Package.resolved anyway,
      # so a stale cache is safe. The builds below pin the clone dir to ./SourcePackages.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select Xcode and assert the iOS SDK
        run: |
          echo "Xcodes present:"; ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting: $LATEST"; sudo xcode-select -s "$LATEST"; xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphonesimulator[0-9.]+' | sed 's/iphonesimulator//' | sort -V | tail -1)
          echo "newest iOS simulator SDK: ${SDK:-<none>}"

      - name: Download the Metal toolchain
        # SwiftTerm >=1.12.0 bundles Apple/Metal/Shaders.metal unconditionally; Xcode 26
        # ships the Metal shader compiler as a separate component. Idempotent — a no-op
        # if already present. Without it `CompileMetalFile` fails.
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20 || \
            echo "::warning::-downloadComponent MetalToolchain returned nonzero (may already be present); continuing"

      - name: Install XcodeGen
        # Skip Homebrew's auto-update (it re-indexes every formula on a cold runner,
        # a minute-plus of pure overhead) — we only need the already-bottled xcodegen.
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator destination
        run: |
          DEST=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | sort -V | tail -1)
          echo "SIM_NAME=${DEST:-iPhone 15}" >> "$GITHUB_ENV"
          echo "using simulator: ${DEST:-iPhone 15}"

      - name: Build for simulator (compile check — SwiftTerm 1.15.0 + Metal + app)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Herdr.xcodeproj -scheme Herdr \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath .build-dd \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || xcodebuild build \
            -project Herdr.xcodeproj -scheme Herdr \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath .build-dd \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the built bundle version
        # READS THE BUILT PRODUCT, not the generated source plist. That distinction is
        # the whole point: xcodegen writes the literal "$(MARKETING_VERSION)" into
        # App/Info.plist and Xcode substitutes it during the build, so a source-plist
        # check reports an unsubstituted variable and proves nothing about what ships.
        # An earlier version of this step made exactly that mistake.
        #
        # The bug this exists for was invisible for months: nothing set
        # CFBundleShortVersionString, so xcodegen wrote its own default "1.0" while
        # project.yml said MARKETING_VERSION 0.1, and it surfaced only when Apple closed
        # the 1.0 train (altool 90186) and every upload started failing. Comparing the
        # BUILT value against project.yml proves the setting actually reaches the bundle.
        run: |
          APP=$(find .build-dd/Build/Products -name '*.app' -maxdepth 3 -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::no built .app found under .build-dd"; exit 1; fi
          echo "built app: $APP"
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          EXPECTED=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*MARKETING_VERSION:[[:space:]]*//' | tr -d '" ')
          echo "built CFBundleShortVersionString=$BUILT  project.yml MARKETING_VERSION=$EXPECTED"
          if [ -z "$BUILT" ]; then echo "::error::built app has no CFBundleShortVersionString"; exit 1; fi
          case "$BUILT" in
            *'$('*) echo "::error::CFBundleShortVersionString did not substitute: $BUILT"; exit 1 ;;
          esac
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::built version ($BUILT) does not match project.yml MARKETING_VERSION ($EXPECTED) — the setting is not reaching the bundle"
            exit 1
          fi

      - name: Run UI scroll-test (the gesture receipt)
        # Runs only if the HerdrUITests target exists in the generated project.
        run: |
          if xcodebuild -project Herdr.xcodeproj -list 2>/dev/null | grep -q HerdrUITests; then
            set -o pipefail
            xcodebuild test \
              -project Herdr.xcodeproj -scheme Herdr \
              -destination "platform=iOS Simulator,name=${SIM_NAME}" \
              -only-testing:HerdrUITests \
              -derivedDataPath .build-dd \
              -clonedSourcePackagesDirPath SourcePackages \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO | xcbeautify || \
            xcodebuild test \
              -project Herdr.xcodeproj -scheme Herdr \
              -destination "platform=iOS Simulator,name=${SIM_NAME}" \
              -only-testing:HerdrUITests \
              -derivedDataPath .build-dd \
              -clonedSourcePackagesDirPath SourcePackages \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "HerdrUITests target not present yet — skipping (compile-check only run)."
          fi

      - name: Upload test result bundle (scroll receipt screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
