name: Gram real Citadel Linux evidence

# Temporary evidence-branch replacement of the registered CI workflow. Never merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Real Citadel / ${{ matrix.app }} app / both servers
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: baseline
            ref: 9876878edea599b347a9788c387107775d848fdc
          - app: current
            ref: ea7f4f5c9c505f449c592b18c6bd05c1d5d7f7f3
    steps:
      - name: Checkout temporary evidence harness
        uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false

      - name: Checkout exact production app source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
          persist-credentials: false

      - name: Install disposable SSH and sandbox dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Do not let package installation start a system-wide sshd.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openssh-server openssh-client python3 curl ca-certificates openssl \
            procps util-linux tmux git

      - name: Build once and measure both disposable servers
        shell: bash
        env:
          GRAM_EVIDENCE_EXPECTED_APP_SHA: ${{ matrix.ref }}
          GRAM_EVIDENCE_APP_LABEL: ${{ matrix.app }}
        run: |
          bash evidence/Tools/ci/gram-real-citadel-evidence.sh \
            "$GITHUB_WORKSPACE/app" "$GITHUB_WORKSPACE/evidence" \
            "$GITHUB_WORKSPACE/gram-evidence"

      - name: Upload sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gram-real-citadel-linux-${{ matrix.app }}-${{ github.run_id }}
          path: gram-evidence/*.json
          if-no-files-found: error
          retention-days: 7
