# TestFlight release lane for Herdrup (com.jerryfane.herdr).
#
# ADAPTED (cited, not copied) from the proven lane the KEEPHAIR seat shipped:
# `.github/workflows/testflight.yml` on jerryfane/keephair (build 105 reached the
# phone from Actions with NO developer Mac in the signing material), + its write-up
# in workflow note 42758 on apps-coc/pr-reviews. Herdr differences are called out
# inline. Key reuse: keephair is on the SAME Apple team (FXQ5Z9HHY6), so the
# distribution CERTIFICATE is team-wide and shared; herdr only needs its own
# provisioning PROFILE for com.jerryfane.herdr.
#
# WHAT THIS IS NOT: the Mac build box (a-tailnet-host:8787) still builds every branch
# for the SIMULATOR and screenshots it — that is the correctness signal and stays.
# This is the RELEASE path on a deliberately independent machine, so the two fail
# independently. Runs only on demand or on a v* tag: an upload burns an App Store
# Connect build number + processing, so never on every push.

name: TestFlight

on:
  # Manual (a release is deliberate) or a v* tag. No inputs: TestFlight "what to test"
  # notes require a betaBuildLocalizations call AFTER processing (a follow-up), so a
  # notes input here would be silently discarded — omitted rather than misleading.
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  # Two uploads racing produce two builds with the same CFBundleVersion; the second
  # is rejected. Serialise rather than discover that at the upload step.
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    # EVERY signing secret lives in this ENVIRONMENT (scoped to main + v* tags), not
    # at repo level: a workflow pushed to a feature branch then cannot reach the
    # distribution material — the cheapest exfiltration path in a repo where agents
    # push branches routinely. (Required-reviewer gating, the one control a shared
    # token can't satisfy, needs GitHub Team on a private repo; this account is Pro,
    # so that is not available — noted, not blocking.)
    environment: testflight

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and assert the iOS SDK
        # Do NOT pin an Xcode path (keephair trap a: /Applications/Xcode_16.app did
        # not exist — a pinned path verifies a filename, not an SDK). Take the newest
        # Xcode present, then ASSERT the SDK meets herdr's 17.0 deployment target
        # (project.yml) — an SDK too old fails inside Archive 20 minutes from here.
        run: |
          echo "Xcodes present:"; ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting: $LATEST"; sudo xcode-select -s "$LATEST"; xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9.]+' | sed 's/iphoneos//' | sort -V | tail -1)
          echo "newest iOS SDK: ${SDK:-<none>}"
          if [ -z "$SDK" ] || [ "$(printf '%s\n17.0\n' "$SDK" | sort -V | head -1)" != "17.0" ]; then
            echo "::error::iOS SDK '${SDK:-none}' is older than herdr's 17.0 deployment target (project.yml)."
            exit 1
          fi

      - name: Install XcodeGen
        # The repo has NO committed .xcodeproj (gitignored, generated). project.yml is
        # at the REPO ROOT (unlike keephair's ios/ subdir).
        run: brew install xcodegen

      - name: Compute build number
        # App Store rejects a duplicate CFBundleVersion. run_number is monotonic per
        # workflow and never reused; herdr has no prior uploads, so no offset is
        # needed yet — BUILD_OFFSET is a knob for later manual uploads (keephair trap
        # d). Herdr's Info.plist is GENERATED by xcodegen (gitignored), so the number
        # is injected at archive via CURRENT_PROJECT_VERSION — no PlistBuddy/sed on a
        # committed plist (avoids keephair's brittle sed-matches-"1").
        run: echo "BUILD=$(( ${{ github.run_number }} + ${{ vars.BUILD_OFFSET || 0 }} ))" >> "$GITHUB_ENV"

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate (throwaway keychain)
        # Signing material lives ONLY in a throwaway keychain deleted in the always()
        # step below — never the login keychain (a runner is shared infra whose
        # default keychain can outlive cleanup on failure paths).
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that never comes and the job
          # hangs until timeout instead of failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/dist.p12
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/herdr.mobileprovision
          echo "installed profile:"
          /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< \
            "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/herdr.mobileprovision)"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jerryfane.herdr</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive
        # CODE_SIGN_STYLE=Manual → the profile MUST be named at ARCHIVE time via
        # PROVISIONING_PROFILE_SPECIFIER (keephair trap b: naming it only in
        # ExportOptions is one step too late; an absent profile and an inadequate one
        # emit the IDENTICAL misleading "requires a provisioning profile with the
        # <capability> feature", sending you to the portal when the fix is here).
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild -project Herdr.xcodeproj -scheme Herdr \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath /tmp/Herdr.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            archive

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive -archivePath /tmp/Herdr.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/export

      - name: Upload to TestFlight
        # The App Store Connect API key already exists (issuer + key id + .p8). altool
        # wants the .p8 on disk at a fixed filename; keephair proved this path ships.
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: |
          # Record when THIS upload began so the verifier can reject any older build
          # of the same number (offset mistake / reused number) as a false green.
          echo "UPLOAD_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Register cleanup BEFORE writing the key, so a failure mid-write cannot
          # leave private-key material behind (the always() step is a second net).
          trap 'rm -f "$KEYFILE"' EXIT
          echo "$ASC_P8_BASE64" | base64 --decode > "$KEYFILE"
          # Do NOT hardcode the .ipa name — it is PRODUCT_NAME (keephair trap c). Herdr's
          # is "Herdr" (no space) but glob anyway and fail loudly with a listing.
          echo "exported artifacts:"; ls -la /tmp/export/
          IPA=$(ls /tmp/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "::error::Export produced no .ipa in /tmp/export (listing above)"; exit 1; fi
          echo "uploading: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Set up the destination verifier (no secrets)
        # Install the verifier's deps in an isolated venv, in a step with NO release
        # secrets in scope, so pip and any build subprocess never inherit the ASC key
        # (codex: a credential must not be exposed to third-party install code).
        run: |
          python3 -m venv /tmp/ascverify
          /tmp/ascverify/bin/pip install --quiet --disable-pip-version-check 'pyjwt~=2.9' 'cryptography~=43.0'

      - name: Verify the build is TestFlight-ready at App Store Connect
        # keephair's hardest lesson: a green run is NOT an artifact arriving. altool
        # reports UPLOAD SUCCEEDED but INGEST lags delivery, and even VALID can reach
        # NOBODY when the build is Missing Compliance. So do not trust "present" —
        # require the build to reach a beta-testable state:
        #   processingState FAILED/INVALID  -> fail now
        #   internalBuildState MISSING_EXPORT_COMPLIANCE -> fail now (trap f, actionable)
        #   internalBuildState READY_FOR_BETA_TESTING / IN_BETA_TESTING -> success
        #   anything still processing -> keep waiting
        # Bind to uploadedDate >= this run's upload so a reused/older build number can
        # never satisfy the check (codex: exact-build false green).
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: |
          /tmp/ascverify/bin/python - <<'PY'
          import base64, json, os, sys, time, urllib.request
          from datetime import datetime, timedelta
          import jwt
          build = os.environ["BUILD"]
          key = base64.b64decode(os.environ["ASC_P8_BASE64"]).decode()
          def token():
              now = int(time.time())
              return jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now+600,
                                 "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                                headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com"+path,
                                         headers={"Authorization": "Bearer "+token()})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return json.load(resp)
          def die(msg):
              print("::error::"+msg); sys.exit(1)
          appid = next((a["id"] for a in
                        get("/v1/apps?filter[bundleId]=com.jerryfane.herdr&limit=1").get("data", [])), None)
          if not appid:
              die("No App Store Connect app record for com.jerryfane.herdr yet — create it first.")
          started = os.environ.get("UPLOAD_STARTED", "")
          cutoff = (datetime.fromisoformat(started.replace("Z", "+00:00")) - timedelta(minutes=2)) if started else None
          for attempt in range(30):  # ~15 min: ingest lags delivery
              resp = get(f"/v1/builds?filter[app]={appid}&filter[version]={build}"
                         f"&limit=10&include=buildBetaDetail")
              beta = {r["id"]: r["attributes"] for r in resp.get("included", [])
                      if r["type"] == "buildBetaDetails"}
              ours = None
              for b in resp.get("data", []):
                  up = b["attributes"].get("uploadedDate")
                  if cutoff and up and datetime.fromisoformat(up.replace("Z", "+00:00")) < cutoff:
                      continue  # an OLDER build carrying this number — not this run's
                  ours = b; break
              if ours:
                  ps = ours["attributes"].get("processingState")
                  if ps in ("FAILED", "INVALID"):
                      die(f"build {build} processingState={ps} — the upload failed at Apple.")
                  bid = ((ours.get("relationships", {}).get("buildBetaDetail", {}) or {}).get("data") or {}).get("id")
                  ibs = beta.get(bid, {}).get("internalBuildState") if bid else None
                  print(f"build {build}: processingState={ps} internalBuildState={ibs}")
                  if ibs == "MISSING_EXPORT_COMPLIANCE":
                      die(f"build {build} is Missing Compliance — set ITSAppUsesNonExemptEncryption in "
                          f"project.yml (or answer export compliance in App Store Connect), else it reaches no testers.")
                  if ibs in ("READY_FOR_BETA_TESTING", "IN_BETA_TESTING"):
                      print(f"build {build} is available to testers (internalBuildState={ibs})."); sys.exit(0)
              else:
                  print(f"build {build} not visible yet (attempt {attempt+1}/30)")
              time.sleep(30)
          die(f"build {build} did not become beta-ready within the window — check App Store Connect "
              f"(delivery != ingest, and Missing Compliance stalls silently).")
          PY

      - name: Clean up signing material
        # Second net for the private-key material: the throwaway keychain, the
        # profile, the decoded .p12, and the decoded .p8 — removed even on the
        # failure paths where a step's own trap/rm did not run.
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/herdr.mobileprovision || true
          rm -f /tmp/dist.p12 || true
          rm -f ~/private_keys/AuthKey_*.p8 || true
