name: App Store Submission 1.0.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Release credentials are intentionally available only to main and v* tags.
    environment: testflight
    steps:
      - uses: actions/checkout@v4

      - name: Install App Store Connect client dependencies
        run: |
          python3 -m venv /tmp/asc
          /tmp/asc/bin/pip install --quiet --disable-pip-version-check 'pyjwt~=2.9' 'cryptography~=43.0'

      - name: Submit Herdr 1.0.6 build 156 for App Store review
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
          HERDR_REVIEW_DEMO_PASSWORD: ${{ secrets.HERDR_REVIEW_DEMO_PASSWORD }}
        run: /tmp/asc/bin/python .github/scripts/asc_submit_release.py
