name: App Store Submission Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install App Store Connect client dependencies
        run: |
          python3 -m venv /tmp/asc
          /tmp/asc/bin/pip install --quiet --disable-pip-version-check 'pyjwt~=2.9' 'cryptography~=43.0'

      - name: Inspect Herdr 1.0.6 build 156 without mutation
        env:
          MODE: inspect
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: /tmp/asc/bin/python .github/scripts/asc_submit_release.py
