name = "herdrup-guest"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
# Attached on deploy; the zone themartian.app must be on the deploying account.
routes = [{ pattern = "guest.herdrup.themartian.app", custom_domain = true }]
# Never push request logs anywhere: see [observability] below.
logpush = false

# The /i invite landing page and its fonts. Requests that match a file never reach the
# Worker. /i/<payload> matches no file, so the Worker serves it the /i page through ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"

# An invite link carries its secret in the path of /i/<payload>, so nothing may record
# request URLs. Workers Logs (whose invocation logs hold the URL of every request),
# traces and Logpush (logpush = false above) stay off, whatever the account default. Stated
# rather than omitted: wrangler leaves the remote setting alone when [observability] is missing.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

# One Durable Object per host_id (guest access contract, herdrup#309/#310).
[[durable_objects.bindings]]
name = "HOSTS"
class_name = "HostRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

# Both keyed by CF-Connecting-IP and checked before the Durable Object is reached.
[[ratelimits]]
name = "GUEST_CONNECT_LIMIT"
namespace_id = "3101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "HOST_CONNECT_LIMIT"
namespace_id = "3102"
simple = { limit = 10, period = 60 }
